[package]
name = "figfig-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[build-dependencies]
tauri-build = { version = "2.7.5", features = [] }

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
figfig-core.workspace = true
tauri = { version = "2.12.6", features = [] }
tauri-plugin-single-instance = "2.5.5"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10.1"
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", features = ["NSScreen", "NSWindow"] }
objc2-foundation = { version = "0.3.2", features = ["NSGeometry", "NSArray"] }
